name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      # Artifacts share one storage quota across all your repos. Upload only the two
      # APKs people install, keep them 3 days, and don't fail the build if the quota is full.
      # Signed builds for phones come from GitHub Releases, which don't use this quota.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 3
          if-no-files-found: error
