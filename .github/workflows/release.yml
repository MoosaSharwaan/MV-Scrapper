name: Release

# Push a tag like v0.1.0 to publish a signed release that Obtainium can install and update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SP: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KA: ${{ secrets.SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing. See README, 'Releases and Obtainium'."
            exit 1
          fi

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease --stacktrace

      - name: Name the APKs
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "out/mv-downloader-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
