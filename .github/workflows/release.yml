name: Release

# Publishes a signed release that Obtainium can install and update. Start it either by
# pushing a tag like v0.1.0, or from the Actions tab: Release -> Run workflow -> enter 0.1.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.1.0 (the tag v0.1.0 is created for you)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the tag
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then tag="v${INPUT#v}"; else tag="$GITHUB_REF_NAME"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag"

      - name: Build signed release APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${TAG#v}"
          ./gradlew assembleRelease --stacktrace

      - name: Name the APKs
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "out/mv-downloader-${TAG}-${abi}.apk"
          done
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
